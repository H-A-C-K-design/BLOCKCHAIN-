<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <!-- Icon Emblem -->
  <g transform="translate(4, 4)">
    <!-- Base Shield / Certificate Shape -->
    <rect x="2" y="2" width="52" height="52" rx="14" fill="#EAF3ED" stroke="#2F6B4F" stroke-width="2"/>
    <!-- Inner Certificate Notch / Emboss -->
    <path d="M14 16H42M14 24H32" stroke="#214B39" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Seal Ribbon Background -->
    <circle cx="36" cy="36" r="12" fill="#2F6B4F"/>
    <!-- Verification Checkmark in Seal -->
    <path d="M31 36L34.5 39.5L41.5 32.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark Text -->
  <text x="74" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#202923">MEMO</tspan>
    <tspan fill="#2F6B4F">CHECK</tspan>
  </text>

  <!-- Tagline -->
  <text x="75" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#66716A">
    VERIFIED ACADEMIC CREDENTIALS
  </text>
</svg>
